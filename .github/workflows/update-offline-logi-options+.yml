name: Update offline-logi-options+ cask

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Check for updates
        id: check
        run: |
          if ./scripts/check-logi-update.sh; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update cask
        if: steps.check.outputs.changed == 'true'
        id: update
        run: |
          result=$(./scripts/update-logi-cask.sh)
          echo "sha256=$(echo "$result" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "version=$(echo "$result" | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update offline-logi-options+ to version ${{ steps.update.outputs.version }}"
          title: "Update offline-logi-options+ to ${{ steps.update.outputs.version }}"
          body: |
            The Logi Options+ offline installer has been updated.

            **New version:** `${{ steps.update.outputs.version }}`
            **New SHA256:** `${{ steps.update.outputs.sha256 }}`

            This PR was automatically generated.
          branch: auto-update/offline-logi-options+
          delete-branch: true
